input {
  http {
    port => "${LOGSTASH_PORT}"
    codec => json
  }
}

filter {
  if [Type] == "heartbeat" {
    mutate {
      add_field => { "[@metadata][index]" => "heartbeat-index" }
    }
  } else if [Type] == "log" {
    mutate {
      add_field => { "[@metadata][index]" => "log-index" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}"] 
    user => "elastic"               
    password => "${ELASTICSEARCH_PASSWORD}" # Configure this in your environment
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}