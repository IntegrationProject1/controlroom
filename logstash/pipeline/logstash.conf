input {
  http {
    port => "${LOGSTASH_PORT}" 
    codec => plain  
  }
}

filter {
  xml {
    source => "message" 
    store_xml => true
    target => "parsed_xml" 
    remove_field => ["headers", "host"]  
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}"] 
    index => "heartbeat-logs" 
    # user => "logstash_internal"
    user => "${ELASTICSEARCH_USER}" # Configure this in your environment
    password => "${LOGSTASH_INTERNAL_PASSWORD}" # Configure this in your environment
  }

  stdout { codec => rubydebug }  # Debug output in Logstash console
}
