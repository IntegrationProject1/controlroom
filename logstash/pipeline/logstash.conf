# === Actieve configuratie ===

# Inkomende berichten via HTTP op de opgegeven poort, verwacht JSON-data
input {
  http {
    port => "${LOGSTASH_PORT}"
    codec => json
  }
}

# Filter bepaalt dynamisch het index-type op basis van het veld 'Type'
filter {
  if [Type] == "heartbeat" {
    mutate {
      add_field => { "[@metadata][index]" => "heartbeat-index" } # Heartbeat-data gaat naar aparte index
    }
  } else if [Type] == "log" {
    mutate {
      add_field => { "[@metadata][index]" => "log-index" } # Logs worden gescheiden verwerkt
    }
  } else if [Type] == "downtime" {
    mutate {
      add_field => { "[@metadata][index]" => "downtime-index" } # Specifieke index voor downtime-events
    }
  }
}

# Uitgaande data wordt naar Elasticsearch gestuurd met dynamisch ingestelde index
output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}"]               # Elasticsearch host (uit env)
    user => "elastic"                                # Authenticatiegebruiker
    password => "${LOGSTASH_INTERNAL_PASSWORD}"      # Wachtwoord uit omgeving
    index => "%{[@metadata][index]}"                 # Index bepaald op basis van metadata uit filter
  }

  stdout { codec => rubydebug } # Debugweergave in de Logstash-console
}
