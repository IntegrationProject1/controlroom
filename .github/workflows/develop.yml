name: ELK CI/CD Develop Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    name: Build & Test Controlroom/ELK
    runs-on: ubuntu-latest

    steps:
      - name: Create .env from Github Secrets
        run: |
          cat <<EOF > .env
          ELASTICSEARCH_USER=${{ secrets.ELASTICSEARCH_USER }}
          ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}
          LOGSTASH_INTERNAL_PASSWORD=${{ secrets.LOGSTASH_INTERNAL_PASSWORD }}
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}
          EOF
          ls -la .env
          cat .env
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set environment variables from GitHub Secrets
        run: |
          echo "ELASTICSEARCH_USER=${{ secrets.ELASTICSEARCH_USER }}" >> $GITHUB_ENV
          echo "ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Docker Images
        run: docker compose build

      - name: Test Docker Compose
        env:
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          LOGSTASH_INTERNAL_PASSWORD: ${{ secrets.LOGSTASH_INTERNAL_PASSWORD }}
        run: |
          docker compose up -d
          sleep 10
          docker ps
          docker inspect --format='{{json .State.Health}}' $(docker ps -q) | jq
          docker compose down
