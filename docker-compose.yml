  test:
    container_name: test_runner
    build: ./integration_test
    depends_on:
      - elasticsearch
      - kibana
      - logstash

    command: sh -c "sleep 120 && pytest test_integration_heartbeat.py -v"

    networks:
      - elk

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Beperk geheugengebruik
      - "ELASTICSEARCH_USER=${ELASTICSEARCH_USER}"
      - "ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}"
      - xpack.security.enabled=true
      - xpack.ml.enabled=false # Machine learning uitschakelen
    ports:
      - "30051:9200"
    ulimits:
      memlock: -1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2GB
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
      - /data/controlroom:/mnt/backups
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,Z
    restart: unless-stopped
    ports:
      - "30052:5601"
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: logstash
    depends_on:
      - elasticsearch
    environment:
      - LOGSTASH_INTERNAL_PASSWORD=${LOGSTASH_INTERNAL_PASSWORD}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_USER=elastic
      - LOGSTASH_URL=${LOGSTASH_URL}
      - LOGSTASH_PORT=${LOGSTASH_PORT}
      - "elasticsearch.username: elastic"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro,Z
    restart: unless-stopped
    ports:
      - "30053:5044" # Beats input
      - "30054:5000/tcp" # Logstash TCP input
      - "30054:5000/udp" # Logstash UDP input
    networks:
      - elk

  # RabbitMQ lokaal gebruiken voor testen – uitgeschakeld in productie
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   environment:
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_USER: ${RABBITMQ_USER}
  #     RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  #     QUEUE_NAME: ${QUEUE_NAME}
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - elk

  consumer: # Ontvangt berichten van RabbitMQ en stuurt ze door naar Logstash
    container_name: controlroom_consumer
    # depends_on:
    #   - rabbitmq
    build: ./consumer
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - LOGSTASH_URL=${LOGSTASH_URL}
    restart: unless-stopped
    networks:
      - elk

  publisher: # Simuleert services die berichten naar RabbitMQ sturen
    container_name: test_publisher
    # depends_on:
    #   - rabbitmq
    build: ./publisher
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - elk

volumes:
  esdata:

networks:
  elk:
    driver: bridge
